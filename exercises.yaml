version: 0.1
description: "Starter exercise pack aligned to CyberPatriot-style tasks"

devices:
  # Minimal device profiles. You can add more later.
  L2_SWITCH:
    start_state:
      hostname: "Switch"
      vlans:
        "1": {name: "default"}
      interfaces:
        "fa0/1": {adminUp: true, l2mode: "access", accessVlan: "1", trunkAllowed: null, ip: null, mask: null}
        "fa0/2": {adminUp: true, l2mode: "access", accessVlan: "1", trunkAllowed: null, ip: null, mask: null}
        "fa0/3": {adminUp: true, l2mode: "access", accessVlan: "1", trunkAllowed: null, ip: null, mask: null}
        "g0/1":  {adminUp: true, l2mode: "access", accessVlan: "1", trunkAllowed: null, ip: null, mask: null}
  L3_SWITCH:
    start_state:
      hostname: "Switch"
      vlans:
        "1": {name: "default"}
      interfaces:
        "g1/0/1": {adminUp: true, l2mode: "access", accessVlan: "1", trunkAllowed: null, ip: null, mask: null}
        "g1/0/2": {adminUp: true, l2mode: "access", accessVlan: "1", trunkAllowed: null, ip: null, mask: null}
        "g1/0/3": {adminUp: true, l2mode: "access", accessVlan: "1", trunkAllowed: null, ip: null, mask: null}
  ROUTER:
    start_state:
      hostname: "Router"
      interfaces:
        "g0/0": {adminUp: true, l2mode: "routed", accessVlan: null, trunkAllowed: null, ip: null, mask: null}
        "g0/1": {adminUp: true, l2mode: "routed", accessVlan: null, trunkAllowed: null, ip: null, mask: null}
        "g0/2": {adminUp: true, l2mode: "routed", accessVlan: null, trunkAllowed: null, ip: null, mask: null}

exercises:

  - id: ex-001-basics-hostname-enable-secret
    title: "Basics: hostname + enable secret"
    device_profile: L2_SWITCH
    instructions: |
      Configure the device:
      - Set hostname to "CorporateSwitch2"
      - Set enable secret to "C1sc0R0ck$" (note: 0 is zero)
      - Save the VALID configuration (configuration must be correct before saving)
    requirements:
      - type: state_equals
        path: hostname
        value: "CorporateSwitch2"
      - type: state_equals
        path: enableSecret
        value: "C1sc0R0ck$"
      - type: config_saved
    hints:
      - "Use: enable → configure terminal → hostname …"
      - "Then: enable secret …"
      - "Finally: end → write memory (IMPORTANT: save AFTER configuring correctly)"

  - id: ex-002-l2-mgmt-ip-default-gateway
    title: "L2 switch management: SVI + ip default-gateway"
    device_profile: L2_SWITCH
    instructions: |
      Configure switch management:
      - Set VLAN 1 SVI IP to 172.16.16.3 255.255.255.0
      - Set ip default-gateway to 172.16.16.1
      - Save the VALID configuration (save AFTER configuring correctly)
    requirements:
      - type: svi_ip_equals
        vlan: "1"
        ip: "172.16.16.3"
        mask: "255.255.255.0"
      - type: state_equals
        path: ipDefaultGateway
        value: "172.16.16.1"
      - type: config_saved
    hints:
      - "Use: interface vlan 1"
      - "Then: ip address … and no shutdown"
      - "Then: ip default-gateway … in global config"
      - "Finally: write memory to save (must save AFTER completing all config)"

  - id: ex-003-vlan-db-and-access-ports
    title: "VLAN database + access ports"
    device_profile: L2_SWITCH
    instructions: |
      Configure VLANs and access ports:
      - Create VLAN 100 and VLAN 200
      - Set Fa0/2 as access VLAN 100
      - Set Fa0/3 as access VLAN 200
      - Save the VALID configuration (all VLANs and ports must be configured first)
    requirements:
      - type: vlan_exists
        vlan: "100"
      - type: vlan_exists
        vlan: "200"
      - type: if_access_vlan_equals
        ifname: "fa0/2"
        vlan: "100"
      - type: if_access_vlan_equals
        ifname: "fa0/3"
        vlan: "200"
      - type: config_saved
    hints:
      - "Use: vlan 100, vlan 200"
      - "Use: interface fa0/2 and switchport mode access"
      - "Use: switchport access vlan …"
      - "Finally: write memory to save"

  - id: ex-004-trunk-allowed-vlans
    title: "Trunking: restrict allowed VLANs"
    device_profile: L2_SWITCH
    instructions: |
      Configure trunk ports:
      - Configure Fa0/1 as trunk, allow only VLANs 1,100,200
      - Configure G0/1 as trunk, allow only VLANs 1,100,200
      - Save the VALID configuration (both trunks must be configured before saving)
    requirements:
      - type: if_trunk_allowed_equals
        ifname: "fa0/1"
        vlans: ["1","100","200"]
      - type: if_trunk_allowed_equals
        ifname: "g0/1"
        vlans: ["1","100","200"]
      - type: config_saved
    hints:
      - "Use: switchport mode trunk"
      - "Then: switchport trunk allowed vlan 1,100,200"
      - "Finally: write memory to save"

  - id: ex-005-l3-switch-no-switchport-and-ip
    title: "Layer 3 switch: routed port with no switchport"
    device_profile: L3_SWITCH
    instructions: |
      Convert a switchport to a routed port and assign an IP:
      - On interface g1/0/2: set no switchport
      - Assign IP 35.72.12.1 255.255.255.252
      - Ensure interface is up (no shutdown)
      - Save the VALID configuration (interface must be fully configured first)
    requirements:
      - type: if_l2mode_equals
        ifname: "g1/0/2"
        l2mode: "routed"
      - type: if_ip_equals
        ifname: "g1/0/2"
        ip: "35.72.12.1"
        mask: "255.255.255.252"
      - type: if_admin_up
        ifname: "g1/0/2"
      - type: config_saved
    hints:
      - "In interface config: no switchport"
      - "Then ip address … and no shutdown"
      - "Finally: write memory to save"

  - id: ex-006-static-default-and-floating-default
    title: "Static routing: default + floating backup"
    device_profile: ROUTER
    instructions: |
      Configure two default routes:
      - Primary: ip route 0.0.0.0 0.0.0.0 35.72.13.1
      - Backup (floating): ip route 0.0.0.0 0.0.0.0 35.72.13.2 254
      - Save the VALID configuration (both routes must be configured before saving)
    requirements:
      - type: route_exists
        dest: "0.0.0.0"
        mask: "0.0.0.0"
        nextHop: "35.72.13.1"
        ad: 1
      - type: route_exists
        dest: "0.0.0.0"
        mask: "0.0.0.0"
        nextHop: "35.72.13.2"
        ad: 254
      - type: config_saved
    hints:
      - "Administrative distance makes the backup route less preferred."
      - "The last number in the backup route is the AD."
      - "Finally: write memory to save"

  - id: ex-007-ospf-area0-process1
    title: "OSPF: process 1, area 0 (single interface)"
    device_profile: ROUTER
    instructions: |
      Configure OSPF:
      - Use process ID 1
      - Add network 35.72.12.2 with wildcard 0.0.0.0 in area 0
      (Note: use the specific interface IP, not the network address)
      - Save the VALID configuration (OSPF must be fully configured first)
    requirements:
      - type: ospf_process_equals
        value: 1
      - type: ospf_network_exists
        ip: "35.72.12.2"
        wildcard: "0.0.0.0"
        area: 0
      - type: config_saved
    hints:
      - "Use: router ospf 1"
      - "Then: network … area 0"
      - "Finally: write memory to save"

  - id: ex-008-ospf-interface-cost
    title: "OSPF: set interface cost"
    device_profile: ROUTER
    instructions: |
      Set OSPF interface costs:
      - On interface g0/0 set ip ospf cost 10
      - On interface g0/2 set ip ospf cost 30
      - Save the VALID configuration (both costs must be set before saving)
    requirements:
      - type: ospf_if_cost_equals
        ifname: "g0/0"
        cost: 10
      - type: ospf_if_cost_equals
        ifname: "g0/2"
        cost: 30
      - type: config_saved
    hints:
      - "Enter interface configuration mode first."
      - "Then run: ip ospf cost …"
      - "Finally: write memory to save"

  - id: ex-009-ssh-setup-vty
    title: "SSH: domain, keys, user, vty lines"
    device_profile: ROUTER
    instructions: |
      Configure SSH remote access:
      - ip domain-name cisco.com
      - crypto key generate rsa modulus 1024
      - ip ssh version 2
      - username admin secret Cyb3rPatriot
      - line vty 0 4
        - login local
        - transport input ssh
      - Save the VALID configuration (all SSH settings must be configured first)
    requirements:
      - type: state_equals
        path: ssh.domainName
        value: "cisco.com"
      - type: state_equals
        path: ssh.rsaModulus
        value: 1024
      - type: state_equals
        path: ssh.sshVersion
        value: 2
      - type: ssh_user_secret_equals
        user: "admin"
        secret: "Cyb3rPatriot"
      - type: state_equals
        path: ssh.vty.login
        value: "local"
      - type: state_equals
        path: ssh.vty.transport
        value: ["ssh"]
      - type: config_saved
    hints:
      - "Keys typically require a domain-name first."
      - "VTY settings live under: line vty 0 4"
      - "Finally: write memory to save"
