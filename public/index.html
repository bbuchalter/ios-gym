<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IOS CLI Typing Trainer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>IOS CLI Typing Trainer</h1>
      <div class="status">
        <span id="connection-status" class="connected">Ready</span>
      </div>
    </header>
    
    <main>
      <div class="terminal-container">
        <div id="terminal"></div>
      </div>
      
      <aside class="exercise-panel">
        <h2>Exercises</h2>
        <div id="exercise-list">
          <p class="placeholder">Loading exercises...</p>
        </div>
        
        <div id="current-exercise" style="display: none;">
          <h2>Current Exercise</h2>
          <div id="exercise-info">
            <p class="placeholder">No exercise loaded</p>
          </div>
          
          <h3>Instructions</h3>
          <div id="exercise-instructions">
            <p class="placeholder">Select an exercise to begin</p>
          </div>
          
          <h3>Status</h3>
          <div id="exercise-status">
            <p class="placeholder">-</p>
          </div>
          
          <h3>Hints</h3>
          <div id="exercise-hints">
            <ul id="hints-list"></ul>
          </div>
        </div>
      </aside>
    </main>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script type="module" src="/terminal-static.js"></script>
</body>
</html>
