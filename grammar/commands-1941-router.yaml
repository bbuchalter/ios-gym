version: 0.1
deviceModel: "1941-router"
description: >
  Cisco 1941 ISR router command grammar for routing practice.
  Supports mode-aware parsing, keyword abbreviation, and tab completion.

settings:
  keyword_abbrev:
    enabled: true
    min_prefix: 1   # IOS-like behavior: allow shortest unambiguous prefix
  case_insensitive: true

modes:
  USER_EXEC:
    prompt: "{hostname}>"
  PRIV_EXEC:
    prompt: "{hostname}#"
  GLOBAL_CONFIG:
    prompt: "{hostname}(config)#"
  IF_CONFIG:
    prompt: "{hostname}(config-if)#"
  CONFIG_VLAN:
    prompt: "{hostname}(config-vlan)#"
  ROUTER_OSPF_CONFIG:
    prompt: "{hostname}(config-router)#"
  LINE_VTY_CONFIG:
    prompt: "{hostname}(config-line)#"
  LINE_CONSOLE_CONFIG:
    prompt: "{hostname}(config-line)#"

# Argument types your parser should support (validate + suggest)
arg_types:
  WORD:
    pattern: "^[^\\s]+$"
  REST_OF_LINE:
    pattern: "^.*$"
  INT:
    pattern: "^\\d+$"
  IP:
    pattern: "^(\\d{1,3}\\.){3}\\d{1,3}$"
  MASK:
    pattern: "^(\\d{1,3}\\.){3}\\d{1,3}$"
  IFNAME:
    # Accept simplified forms for router: g0/0, gi0/0, gigabitethernet0/0, vlan1
    # Note: No FastEthernet interfaces on routers
    pattern: "^(gi|g|gigabitethernet)?\\d+(\\/\\d+)+$|^vlan\\s*\\d+$"
  VLAN_ID:
    pattern: "^\\d+$"
  VLAN_LIST:
    # IOS style: 1,100,200 or 1-10,20,30-40
    pattern: "^[0-9,-]+$"
  AREA:
    pattern: "^\\d+$"
  WILDCARD:
    pattern: "^(\\d{1,3}\\.){3}\\d{1,3}$"

# The "device state" keys your handlers should read/write
state_schema:
  hostname: "Router"
  enableSecret: null

  interfaces: {}     # map: ifname -> properties
  vlans:
    "1":
      name: "default"
  svis: {}           # map: vlan_id -> {ip, mask, adminUp}
  ipDefaultGateway: null

  routes: []         # list of {dest, mask, nextHop, ad}
  ospf:
    processId: null
    networks: []     # list of {ip, wildcard, area}
    ifCosts: {}      # map ifname -> cost

  ssh:
    domainName: null
    rsaModulus: null
    sshVersion: null
    users: {}        # map username -> {secret}
    vty:
      range: null
      login: null
      transport: []  # e.g., ["ssh"]

# Command grammar by mode
commands:

  USER_EXEC:
    - name: enable
      tokens: ["enable"]
      action: {type: "enable_with_password", mode: "PRIV_EXEC"}
      help: "Enter privileged EXEC mode"

    - name: exit
      tokens: ["exit"]
      action: {type: "session_end"}
      help: "Close session"

    - name: show_running_config_user
      tokens: ["show", "running-config"]
      action: {type: "render", template: "show_running_config"}
      help: "Show running configuration (read-only in user EXEC)"

    - name: show_ip_interface_brief_user
      tokens: ["show", "ip", "interface", "brief"]
      action: {type: "render", template: "show_ip_interface_brief"}
      help: "Show IP interface status"

    - name: show_vlan_brief_user
      tokens: ["show", "vlan", "brief"]
      action: {type: "render", template: "show_vlan_brief"}
      help: "Show VLAN summary"

  PRIV_EXEC:
    - name: disable
      tokens: ["disable"]
      action: {type: "mode_pop_to", mode: "USER_EXEC"}
      help: "Return to user EXEC mode"

    - name: configure_terminal
      tokens: ["configure", "terminal"]
      action: {type: "mode_push", mode: "GLOBAL_CONFIG"}
      help: "Enter global configuration mode"

    - name: write_memory
      tokens: ["write", "memory"]
      action: {type: "persist"}
      output: "Building configuration...\n[OK]"
      help: "Save configuration"

    - name: copy_run_start
      tokens: ["copy", "running-config", "startup-config"]
      action: {type: "persist"}
      output: "Destination filename [startup-config]?\nBuilding configuration...\n[OK]"
      help: "Save configuration"

    - name: show_running_config_priv
      tokens: ["show", "running-config"]
      action: {type: "render", template: "show_running_config"}
      help: "Show running configuration"

    - name: show_vlan_brief
      tokens: ["show", "vlan", "brief"]
      action: {type: "render", template: "show_vlan_brief"}
      help: "Show VLAN summary"

    - name: show_ip_interface_brief
      tokens: ["show", "ip", "interface", "brief"]
      action: {type: "render", template: "show_ip_interface_brief"}
      help: "Show IP interface status"

    - name: show_ip_route
      tokens: ["show", "ip", "route"]
      action: {type: "render", template: "show_ip_route"}
      help: "Show routing table"

  GLOBAL_CONFIG:
    - name: end
      tokens: ["end"]
      action: {type: "mode_pop_to", mode: "PRIV_EXEC"}
      help: "Exit to privileged EXEC"

    - name: exit
      tokens: ["exit"]
      action: {type: "mode_pop"}
      help: "Exit one mode level"

    - name: hostname
      tokens: ["hostname", {arg: "WORD", name: "hostname"}]
      action:
        type: "set"
        path: "hostname"
        value_from: "hostname"
      help: "Set system hostname"

    - name: enable_secret
      tokens: ["enable", "secret", {arg: "REST_OF_LINE", name: "secret"}]
      action:
        type: "set"
        path: "enableSecret"
        value_from: "secret"
      help: "Set enable secret"

    - name: no_hostname
      tokens: ["no", "hostname"]
      action:
        type: "set"
        path: "hostname"
        value: "Switch"
      help: "Reset hostname to default"

    - name: no_enable_secret
      tokens: ["no", "enable", "secret"]
      action:
        type: "set"
        path: "enableSecret"
        value: null
      help: "Remove enable secret"

    # VLAN
    - name: vlan
      tokens: ["vlan", {arg: "VLAN_ID", name: "vlan"}]
      action:
        type: "vlan_enter"
        vlan_from: "vlan"
        mode: "CONFIG_VLAN"
      help: "Create/select a VLAN and enter VLAN config context"

    # Interface
    - name: interface
      tokens: ["interface", {arg: "IFNAME", name: "ifname"}]
      action: {type: "if_enter", if_from: "ifname", mode: "IF_CONFIG"}
      help: "Enter interface configuration mode"
      complete:
        arg: "IFNAME"
        from_state: "interfaces.keys"
        defaults: ["g0/0", "g0/1", "g0/2", "g1/0/1", "g1/0/2", "fa0/1", "fa0/2", "fa0/3", "vlan 1", "vlan 100", "vlan 200"]

    # L2 management default gateway
    - name: ip_default_gateway
      tokens: ["ip", "default-gateway", {arg: "IP", name: "gw"}]
      action: {type: "set", path: "ipDefaultGateway", value_from: "gw"}
      help: "Set default gateway (L2 switch management)"

    # Static routing
    - name: ip_route
      tokens:
        - "ip"
        - "route"
        - {arg: "IP", name: "dest"}
        - {arg: "IP", name: "mask"}
        - {arg: "IP", name: "nextHop"}
        - {optional_arg: "INT", name: "ad"}
      action:
        type: "route_add"
        dest_from: "dest"
        mask_from: "mask"
        nextHop_from: "nextHop"
        ad_from: "ad"
        ad_default: 1
      help: "Add static route (supports floating route via AD)"

    # OSPF
    - name: router_ospf
      tokens: ["router", "ospf", {arg: "INT", name: "pid"}]
      action: {type: "ospf_enter", pid_from: "pid", mode: "ROUTER_OSPF_CONFIG"}
      help: "Enter OSPF router config mode"

    # SSH primitives
    - name: ip_domain_name
      tokens: ["ip", "domain-name", {arg: "WORD", name: "domain"}]
      action: {type: "set", path: "ssh.domainName", value_from: "domain"}
      help: "Set IP domain-name (SSH prerequisite)"

    - name: ip_ssh_version
      tokens: ["ip", "ssh", "version", {arg: "INT", name: "ver"}]
      action: {type: "set", path: "ssh.sshVersion", value_from: "ver"}
      help: "Set SSH version"

    - name: username_secret
      tokens: ["username", {arg: "WORD", name: "user"}, "secret", {arg: "REST_OF_LINE", name: "pw"}]
      action: {type: "ssh_user_set", user_from: "user", secret_from: "pw"}
      help: "Create local user with secret"

    - name: crypto_key_gen_rsa
      tokens: ["crypto", "key", "generate", "rsa", "modulus", {arg: "INT", name: "mod"}]
      action: {type: "set", path: "ssh.rsaModulus", value_from: "mod"}
      output: "The key modulus size is {mod} bits\n% Generating {mod}-bit RSA keys, keys will be non-exportable...\n[OK]"
      help: "Generate RSA keys (simplified)"

    - name: line_vty
      tokens: ["line", "vty", {arg: "INT", name: "start"}, {arg: "INT", name: "end"}]
      action:
        type: "line_vty_enter"
        range: "{start} {end}"
        mode: "LINE_VTY_CONFIG"
      help: "Enter VTY line configuration mode"

    - name: line_console
      tokens: ["line", "console", "0"]
      action: {type: "mode_push", mode: "LINE_CONSOLE_CONFIG"}
      help: "Enter console line configuration mode"

  IF_CONFIG:
    - name: exit
      tokens: ["exit"]
      action: {type: "mode_pop"}
      help: "Exit interface configuration"

    - name: end
      tokens: ["end"]
      action: {type: "mode_pop_to", mode: "PRIV_EXEC"}
      help: "Exit to privileged EXEC"

    - name: no_shutdown
      tokens: ["no", "shutdown"]
      action: {type: "if_set", path: "adminUp", value: true}
      help: "Enable interface"

    - name: ip_address
      tokens: ["ip", "address", {arg: "IP", name: "ip"}, {arg: "MASK", name: "mask"}]
      action: {type: "if_set_ip", ip_from: "ip", mask_from: "mask"}
      help: "Set interface IP address"

    - name: ip_ospf_cost
      tokens: ["ip", "ospf", "cost", {arg: "INT", name: "cost"}]
      action: {type: "ospf_if_cost_set", cost_from: "cost"}
      help: "Set OSPF interface cost"

  CONFIG_VLAN:
    - name: exit
      tokens: ["exit"]
      action: {type: "mode_pop"}
      help: "Exit VLAN configuration"

    - name: end
      tokens: ["end"]
      action: {type: "mode_pop_to", mode: "PRIV_EXEC"}
      help: "Exit to privileged EXEC"

    - name: vlan_name
      tokens: ["name", {arg: "REST_OF_LINE", name: "vlan_name"}]
      guard:
        requires_cursor: "current_vlan"
      action:
        type: "vlan_set_name"
        vlan_cursor: "current_vlan"
        name_from: "vlan_name"
      help: "Name the currently selected VLAN"

  ROUTER_OSPF_CONFIG:
    - name: exit
      tokens: ["exit"]
      action: {type: "mode_pop"}
      help: "Exit router config"

    - name: end
      tokens: ["end"]
      action: {type: "mode_pop_to", mode: "PRIV_EXEC"}
      help: "Exit to privileged EXEC"

    - name: network_area
      tokens:
        - "network"
        - {arg: "IP", name: "ip"}
        - {arg: "WILDCARD", name: "wc"}
        - "area"
        - {arg: "AREA", name: "area"}
      action:
        type: "ospf_network_add"
        ip_from: "ip"
        wildcard_from: "wc"
        area_from: "area"
      help: "Advertise network in OSPF"

  LINE_VTY_CONFIG:
    - name: exit
      tokens: ["exit"]
      action: {type: "mode_pop"}
      help: "Exit line config"

    - name: end
      tokens: ["end"]
      action: {type: "mode_pop_to", mode: "PRIV_EXEC"}
      help: "Exit to privileged EXEC"

    - name: login_local
      tokens: ["login", "local"]
      action: {type: "set", path: "ssh.vty.login", value: "local"}
      help: "Use local user database"

    - name: transport_input_ssh
      tokens: ["transport", "input", "ssh"]
      action: {type: "set", path: "ssh.vty.transport", value: ["ssh"]}
      help: "Allow SSH only"

  LINE_CONSOLE_CONFIG:
    - name: exit
      tokens: ["exit"]
      action: {type: "mode_pop"}
      help: "Exit line config"

    - name: end
      tokens: ["end"]
      action: {type: "mode_pop_to", mode: "PRIV_EXEC"}
      help: "Exit to privileged EXEC"

    - name: logging_synchronous
      tokens: ["logging", "synchronous"]
      action: {type: "set", path: "line.console.loggingSynchronous", value: true}
      help: "Synchronize console messages with command input"

    - name: no_logging_synchronous
      tokens: ["no", "logging", "synchronous"]
      action: {type: "set", path: "line.console.loggingSynchronous", value: false}
      help: "Disable logging synchronous"

templates:
  show_running_config: |
    Building configuration...

    Current configuration : 608 bytes
    !
    version 15.1
    no service timestamps log datetime msec
    no service timestamps debug datetime msec
    no service password-encryption
    !
    hostname {hostname}
    {#if enableSecret}!
    enable secret 5 {enableSecret}
    {#endif}!
    !
    !
    !
    !
    !
    !
    !
    ip cef
    no ipv6 cef
    !
    !
    !
    !
    license udi pid CISCO1941/K9 sn FTX15242K0C-
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    !
    spanning-tree mode pvst
    !
    !
    !
    !
    !
    !
    {#interfaces}interface {name_full}{#if name != "vlan1"}
     no ip address
     duplex auto
     speed auto{#endif}{#if ip}
     ip address {ip} {mask}{#endif}{#if name == "vlan1"}
     no ip address{#endif}{#if name == "vlan1"}
     shutdown{#endif}{#if adminUp}{#if name != "vlan1"}
     no shutdown{#endif}{#endif}
    !
    {#endifaces_end}ip classless
    {#routes}ip route {dest} {mask} {nextHop}
    {#endroutes}!
    ip flow-export version 9
    !
    !
    !
    !
    !
    !
    !
    line con 0
    !
    line aux 0
    !
    line vty 0 4
     login
    !
    !
    !
    end

  show_vlan_brief: |
    
    VLAN Name                             Status    Ports
    ---- -------------------------------- --------- -------------------------------
    {#vlans_with_ports}{id} {name_or_default} {status} {ports}
    {#endvlans_with_ports}

  show_ip_interface_brief: |
    Interface              IP-Address      OK? Method Status                Protocol
    {#interfaces}{name_full_padded} {ip_or_unassigned} YES manual {status}{protocol}
    {#endifaces_end}

  show_ip_route: |
    Codes: C - connected, S - static, O - OSPF
    {#routes}
    S*  {dest}/{mask} [AD {ad}] via {nextHop}
    {#end}
