version: 0.1
deviceModel: "1941-router"
description: >
  Cisco 1941 ISR router command grammar for routing practice.
  Supports mode-aware parsing, keyword abbreviation, and tab completion.

settings:
  keyword_abbrev:
    enabled: true
    min_prefix: 1   # IOS-like behavior: allow shortest unambiguous prefix
  case_insensitive: true

modes:
  USER_EXEC:
    prompt: "{hostname}>"
  PRIV_EXEC:
    prompt: "{hostname}#"
  GLOBAL_CONFIG:
    prompt: "{hostname}(config)#"
  IF_CONFIG:
    prompt: "{hostname}(config-if)#"
  CONFIG_VLAN:
    prompt: "{hostname}(config-vlan)#"
  ROUTER_OSPF_CONFIG:
    prompt: "{hostname}(config-router)#"
  LINE_VTY_CONFIG:
    prompt: "{hostname}(config-line)#"
  LINE_CONSOLE_CONFIG:
    prompt: "{hostname}(config-line)#"
  DHCP_POOL_CONFIG:
    prompt: "{hostname}(dhcp-config)#"

# Argument types your parser should support (validate + suggest)
arg_types:
  WORD:
    pattern: "^[^\\s]+$"
  REST_OF_LINE:
    pattern: "^.*$"
  INT:
    pattern: "^\\d+$"
  IP:
    pattern: "^(\\d{1,3}\\.){3}\\d{1,3}$"
  MASK:
    pattern: "^(\\d{1,3}\\.){3}\\d{1,3}$"
  IFNAME:
    # Accept simplified forms for router: g0/0, gi0/0, gigabitethernet0/0, vlan1
    # Note: No FastEthernet interfaces on routers
    pattern: "^(gi|g|gigabitethernet)?\\d+(\\/\\d+)+$|^vlan\\s*\\d+$"
  VLAN_ID:
    pattern: "^\\d+$"
  VLAN_LIST:
    # IOS style: 1,100,200 or 1-10,20,30-40
    pattern: "^[0-9,-]+$"
  AREA:
    pattern: "^\\d+$"
  WILDCARD:
    pattern: "^(\\d{1,3}\\.){3}\\d{1,3}$"
  ACL_NUMBER_STD:
    # Standard ACL numbers: 1-99
    pattern: "^[1-9][0-9]?$"
  ACL_NUMBER_EXT:
    # Extended ACL numbers: 100-199
    pattern: "^1[0-9]{2}$"
  ACL_ACTION:
    # permit or deny
    pattern: "^(permit|deny)$"
  ACL_PROTOCOL:
    # Common protocols for extended ACLs
    pattern: "^(ip|tcp|udp|icmp|ospf)$"
  ACL_SOURCE:
    # any, host x.x.x.x, or x.x.x.x (network)
    pattern: "^(any|host|(\\d{1,3}\\.){3}\\d{1,3})$"

# The "device state" keys your handlers should read/write
state_schema:
  hostname: "Router"
  enableSecret: null

  interfaces: {}     # map: ifname -> properties
  vlans:
    "1":
      name: "default"
  svis: {}           # map: vlan_id -> {ip, mask, adminUp}
  ipDefaultGateway: null

  routes: []         # list of {dest, mask, nextHop, ad}
  ospf:
    processId: null
    networks: []     # list of {ip, wildcard, area}
    ifCosts: {}      # map ifname -> cost

  ssh:
    domainName: null
    rsaModulus: null
    sshVersion: null
    users: {}        # map username -> {secret}
    vty:
      range: null
      login: null
      transport: []  # e.g., ["ssh"]

# Command grammar by mode
commands:

  USER_EXEC:
    - name: enable
      tokens: ["enable"]
      action: {type: "enable_with_password", mode: "PRIV_EXEC"}
      help: "Enter privileged EXEC mode"

    - name: exit
      tokens: ["exit"]
      action: {type: "session_end"}
      help: "Close session"

    - name: show_running_config_user
      tokens: ["show", "running-config"]
      action: {type: "render", template: "show_running_config"}
      help: "Show running configuration (read-only in user EXEC)"

    - name: show_ip_interface_brief_user
      tokens: ["show", "ip", "interface", "brief"]
      action: {type: "render", template: "show_ip_interface_brief"}
      help: "Show IP interface status"

    - name: show_vlan_brief_user
      tokens: ["show", "vlan", "brief"]
      action: {type: "render", template: "show_vlan_brief"}
      help: "Show VLAN summary"

  PRIV_EXEC:
    - name: disable
      tokens: ["disable"]
      action: {type: "mode_pop_to", mode: "USER_EXEC"}
      help: "Return to user EXEC mode"

    - name: configure_terminal
      tokens: ["configure", "terminal"]
      action: {type: "mode_push", mode: "GLOBAL_CONFIG"}
      help: "Enter global configuration mode"

    - name: write_memory
      tokens: ["write", "memory"]
      action: {type: "persist"}
      output: "Building configuration...\n[OK]"
      help: "Save configuration"

    - name: copy_run_start
      tokens: ["copy", "running-config", "startup-config"]
      action: {type: "persist"}
      output: "Destination filename [startup-config]?\nBuilding configuration...\n[OK]"
      help: "Save configuration"

    - name: show_running_config_priv
      tokens: ["show", "running-config"]
      action: {type: "render", template: "show_running_config"}
      help: "Show running configuration"

    - name: show_vlan_brief
      tokens: ["show", "vlan", "brief"]
      action: {type: "render", template: "show_vlan_brief"}
      help: "Show VLAN summary"

    - name: show_ip_interface_brief
      tokens: ["show", "ip", "interface", "brief"]
      action: {type: "render", template: "show_ip_interface_brief"}
      help: "Show IP interface status"

    - name: show_ip_route
      tokens: ["show", "ip", "route"]
      action: {type: "render", template: "show_ip_route"}
      help: "Show routing table"

    - name: show_access_lists
      tokens: ["show", "access-lists"]
      action: {type: "render", template: "show_access_lists"}
      help: "Display all access lists"

  GLOBAL_CONFIG:
    - name: end
      tokens: ["end"]
      action: {type: "mode_pop_to", mode: "PRIV_EXEC"}
      help: "Exit to privileged EXEC"

    - name: exit
      tokens: ["exit"]
      action: {type: "mode_pop"}
      help: "Exit one mode level"

    - name: hostname
      tokens: ["hostname", {arg: "WORD", name: "hostname"}]
      action:
        type: "set"
        path: "hostname"
        value_from: "hostname"
      help: "Set system hostname"

    - name: enable_secret
      tokens: ["enable", "secret", {arg: "REST_OF_LINE", name: "secret"}]
      action:
        type: "set"
        path: "enableSecret"
        value_from: "secret"
      help: "Set enable secret"

    - name: no_hostname
      tokens: ["no", "hostname"]
      action:
        type: "set"
        path: "hostname"
        value: "Switch"
      help: "Reset hostname to default"

    - name: no_enable_secret
      tokens: ["no", "enable", "secret"]
      action:
        type: "set"
        path: "enableSecret"
        value: null
      help: "Remove enable secret"

    # Password encryption
    - name: service_password_encryption
      tokens: ["service", "password-encryption"]
      action: {type: "set", path: "servicePasswordEncryption", value: true}
      help: "Encrypt all passwords in configuration"

    - name: no_service_password_encryption
      tokens: ["no", "service", "password-encryption"]
      action: {type: "set", path: "servicePasswordEncryption", value: false}
      help: "Disable password encryption"

    # VLAN
    - name: vlan
      tokens: ["vlan", {arg: "VLAN_ID", name: "vlan"}]
      action:
        type: "vlan_enter"
        vlan_from: "vlan"
        mode: "CONFIG_VLAN"
      help: "Create/select a VLAN and enter VLAN config context"

    # Interface
    - name: interface
      tokens: ["interface", {arg: "IFNAME", name: "ifname"}]
      action: {type: "if_enter", if_from: "ifname", mode: "IF_CONFIG"}
      help: "Enter interface configuration mode"
      complete:
        arg: "IFNAME"
        from_state: "interfaces.keys"
        defaults: ["g0/0", "g0/1", "g0/2", "g1/0/1", "g1/0/2", "fa0/1", "fa0/2", "fa0/3", "vlan 1", "vlan 100", "vlan 200"]

    # L2 management default gateway
    - name: ip_default_gateway
      tokens: ["ip", "default-gateway", {arg: "IP", name: "gw"}]
      action: {type: "set", path: "ipDefaultGateway", value_from: "gw"}
      help: "Set default gateway (L2 switch management)"

    # Static routing
    - name: ip_route
      tokens:
        - "ip"
        - "route"
        - {arg: "IP", name: "dest"}
        - {arg: "IP", name: "mask"}
        - {arg: "IP", name: "nextHop"}
        - {optional_arg: "INT", name: "ad"}
      action:
        type: "route_add"
        dest_from: "dest"
        mask_from: "mask"
        nextHop_from: "nextHop"
        ad_from: "ad"
        ad_default: 1
      help: "Add static route (supports floating route via AD)"

    # Enable IP routing (routers have this enabled by default, but allow the command)
    - name: ip_routing
      tokens: ["ip", "routing"]
      action: {type: "set", path: "ipRouting", value: true}
      help: "Enable IP routing"

    # Disable IP routing
    - name: no_ip_routing
      tokens: ["no", "ip", "routing"]
      action: {type: "set", path: "ipRouting", value: false}
      help: "Disable IP routing"

    # OSPF
    - name: router_ospf
      tokens: ["router", "ospf", {arg: "INT", name: "pid"}]
      action: {type: "ospf_enter", pid_from: "pid", mode: "ROUTER_OSPF_CONFIG"}
      help: "Enter OSPF router config mode"

    # SSH primitives
    - name: ip_domain_name
      tokens: ["ip", "domain-name", {arg: "WORD", name: "domain"}]
      action: {type: "set", path: "ssh.domainName", value_from: "domain"}
      help: "Set IP domain-name (SSH prerequisite)"

    - name: ip_ssh_version
      tokens: ["ip", "ssh", "version", {arg: "INT", name: "ver"}]
      action: {type: "set", path: "ssh.sshVersion", value_from: "ver"}
      help: "Set SSH version"

    - name: username_secret
      tokens: ["username", {arg: "WORD", name: "user"}, "secret", {arg: "REST_OF_LINE", name: "pw"}]
      action: {type: "ssh_user_set", user_from: "user", secret_from: "pw"}
      help: "Create local user with secret"

    - name: crypto_key_gen_rsa
      tokens: ["crypto", "key", "generate", "rsa", "modulus", {arg: "INT", name: "mod"}]
      action: {type: "set", path: "ssh.rsaModulus", value_from: "mod"}
      output: "The key modulus size is {mod} bits\n% Generating {mod}-bit RSA keys, keys will be non-exportable...\n[OK]"
      help: "Generate RSA keys (simplified)"

    - name: line_vty
      tokens: ["line", "vty", {arg: "INT", name: "start"}, {arg: "INT", name: "end"}]
      action:
        type: "line_vty_enter"
        range: "{start} {end}"
        mode: "LINE_VTY_CONFIG"
      help: "Enter VTY line configuration mode"

    - name: line_console
      tokens: ["line", "console", "0"]
      action: {type: "mode_push", mode: "LINE_CONSOLE_CONFIG"}
      help: "Enter console line configuration mode"

    # ===== ACCESS CONTROL LISTS (ACLs) =====
    
    # Standard ACL (1-99): permit/deny based on source only
    - name: access_list_std_any
      tokens: ["access-list", {arg: "ACL_NUMBER_STD", name: "num"}, {arg: "ACL_ACTION", name: "action"}, "any"]
      action:
        type: "acl_add_std"
        number_from: "num"
        action_from: "action"
        source: "any"
      help: "Create standard ACL entry for any source"

    - name: access_list_std_host
      tokens: ["access-list", {arg: "ACL_NUMBER_STD", name: "num"}, {arg: "ACL_ACTION", name: "action"}, "host", {arg: "IP", name: "ip"}]
      action:
        type: "acl_add_std"
        number_from: "num"
        action_from: "action"
        source: "host"
        source_ip_from: "ip"
      help: "Create standard ACL entry for specific host"

    - name: access_list_std_network
      tokens: ["access-list", {arg: "ACL_NUMBER_STD", name: "num"}, {arg: "ACL_ACTION", name: "action"}, {arg: "IP", name: "net"}, {arg: "WILDCARD", name: "wc"}]
      action:
        type: "acl_add_std"
        number_from: "num"
        action_from: "action"
        source_ip_from: "net"
        source_wildcard_from: "wc"
      help: "Create standard ACL entry for network"

    # Extended ACL (100-199): permit/deny based on protocol, source, and destination
    - name: access_list_ext_any_any
      tokens: ["access-list", {arg: "ACL_NUMBER_EXT", name: "num"}, {arg: "ACL_ACTION", name: "action"}, {arg: "ACL_PROTOCOL", name: "proto"}, "any", "any"]
      action:
        type: "acl_add_ext"
        number_from: "num"
        action_from: "action"
        protocol_from: "proto"
        source: "any"
        destination: "any"
      help: "Create extended ACL entry: any source to any destination"

    - name: access_list_ext_host_any
      tokens: ["access-list", {arg: "ACL_NUMBER_EXT", name: "num"}, {arg: "ACL_ACTION", name: "action"}, {arg: "ACL_PROTOCOL", name: "proto"}, "host", {arg: "IP", name: "src_ip"}, "any"]
      action:
        type: "acl_add_ext"
        number_from: "num"
        action_from: "action"
        protocol_from: "proto"
        source: "host"
        source_ip_from: "src_ip"
        destination: "any"
      help: "Create extended ACL entry: specific host to any destination"

    - name: access_list_ext_any_host
      tokens: ["access-list", {arg: "ACL_NUMBER_EXT", name: "num"}, {arg: "ACL_ACTION", name: "action"}, {arg: "ACL_PROTOCOL", name: "proto"}, "any", "host", {arg: "IP", name: "dst_ip"}]
      action:
        type: "acl_add_ext"
        number_from: "num"
        action_from: "action"
        protocol_from: "proto"
        source: "any"
        destination: "host"
        dest_ip_from: "dst_ip"
      help: "Create extended ACL entry: any source to specific host"

    - name: access_list_ext_host_host
      tokens: ["access-list", {arg: "ACL_NUMBER_EXT", name: "num"}, {arg: "ACL_ACTION", name: "action"}, {arg: "ACL_PROTOCOL", name: "proto"}, "host", {arg: "IP", name: "src_ip"}, "host", {arg: "IP", name: "dst_ip"}]
      action:
        type: "acl_add_ext"
        number_from: "num"
        action_from: "action"
        protocol_from: "proto"
        source: "host"
        source_ip_from: "src_ip"
        destination: "host"
        dest_ip_from: "dst_ip"
      help: "Create extended ACL entry: specific host to specific host"

    - name: access_list_ext_net_any
      tokens: ["access-list", {arg: "ACL_NUMBER_EXT", name: "num"}, {arg: "ACL_ACTION", name: "action"}, {arg: "ACL_PROTOCOL", name: "proto"}, {arg: "IP", name: "src_net"}, {arg: "WILDCARD", name: "src_wc"}, "any"]
      action:
        type: "acl_add_ext"
        number_from: "num"
        action_from: "action"
        protocol_from: "proto"
        source_ip_from: "src_net"
        source_wildcard_from: "src_wc"
        destination: "any"
      help: "Create extended ACL entry: network to any destination"

    - name: access_list_ext_any_net
      tokens: ["access-list", {arg: "ACL_NUMBER_EXT", name: "num"}, {arg: "ACL_ACTION", name: "action"}, {arg: "ACL_PROTOCOL", name: "proto"}, "any", {arg: "IP", name: "dst_net"}, {arg: "WILDCARD", name: "dst_wc"}]
      action:
        type: "acl_add_ext"
        number_from: "num"
        action_from: "action"
        protocol_from: "proto"
        source: "any"
        dest_ip_from: "dst_net"
        dest_wildcard_from: "dst_wc"
      help: "Create extended ACL entry: any source to network"

    # Remove entire ACL
    - name: no_access_list
      tokens: ["no", "access-list", {arg: "INT", name: "num"}]
      action:
        type: "acl_remove"
        number_from: "num"
      help: "Remove entire access list"

    # ===== NETWORK ADDRESS TRANSLATION (NAT/PAT) =====
    
    # PAT (Port Address Translation) - overload
    - name: ip_nat_inside_source_list_interface_overload
      tokens: ["ip", "nat", "inside", "source", "list", {arg: "INT", name: "acl"}, "interface", {arg: "IFNAME", name: "if"}, "overload"]
      action:
        type: "nat_overload_enable"
        acl_from: "acl"
        interface_from: "if"
      help: "Enable PAT using interface IP"

    - name: no_ip_nat_inside_source_list_interface_overload
      tokens: ["no", "ip", "nat", "inside", "source", "list", {arg: "INT", name: "acl"}, "interface", {arg: "IFNAME", name: "if"}, "overload"]
      action: {type: "nat_overload_disable"}
      help: "Disable PAT"

    # Static NAT
    - name: ip_nat_inside_source_static
      tokens: ["ip", "nat", "inside", "source", "static", {arg: "IP", name: "local"}, {arg: "IP", name: "global"}]
      action:
        type: "nat_static_add"
        inside_local_from: "local"
        inside_global_from: "global"
      help: "Create static NAT mapping"

    - name: no_ip_nat_inside_source_static
      tokens: ["no", "ip", "nat", "inside", "source", "static", {arg: "IP", name: "local"}, {arg: "IP", name: "global"}]
      action:
        type: "nat_static_remove"
        inside_local_from: "local"
        inside_global_from: "global"
      help: "Remove static NAT mapping"

    # ===== DHCP SERVER CONFIGURATION =====
    
    # Exclude addresses from DHCP pool (range)
    - name: ip_dhcp_excluded_address_range
      tokens: ["ip", "dhcp", "excluded-address", {arg: "IP", name: "start"}, {arg: "IP", name: "end"}]
      action:
        type: "dhcp_excluded_address"
        start_from: "start"
        end_from: "end"
      help: "Exclude range of addresses from DHCP allocation"

    # Exclude single address from DHCP pool
    - name: ip_dhcp_excluded_address_single
      tokens: ["ip", "dhcp", "excluded-address", {arg: "IP", name: "start"}]
      action:
        type: "dhcp_excluded_address"
        start_from: "start"
      help: "Exclude single address from DHCP allocation"

    # Remove excluded address range
    - name: no_ip_dhcp_excluded_address_range
      tokens: ["no", "ip", "dhcp", "excluded-address", {arg: "IP", name: "start"}, {arg: "IP", name: "end"}]
      action:
        type: "dhcp_remove_excluded_address"
        start_from: "start"
        end_from: "end"
      help: "Remove excluded address range"

    # Create/enter DHCP pool
    - name: ip_dhcp_pool
      tokens: ["ip", "dhcp", "pool", {arg: "WORD", name: "name"}]
      action:
        type: "dhcp_pool_enter"
        name_from: "name"
        mode: "DHCP_POOL_CONFIG"
      help: "Create DHCP pool and enter configuration mode"

    # Remove DHCP pool
    - name: no_ip_dhcp_pool
      tokens: ["no", "ip", "dhcp", "pool", {arg: "WORD", name: "name"}]
      action:
        type: "dhcp_pool_remove"
        name_from: "name"
      help: "Remove DHCP pool"

  IF_CONFIG:
    - name: exit
      tokens: ["exit"]
      action: {type: "mode_pop"}
      help: "Exit interface configuration"

    - name: end
      tokens: ["end"]
      action: {type: "mode_pop_to", mode: "PRIV_EXEC"}
      help: "Exit to privileged EXEC"

    - name: no_shutdown
      tokens: ["no", "shutdown"]
      action: {type: "if_set", path: "adminUp", value: true}
      help: "Enable interface"

    - name: ip_address
      tokens: ["ip", "address", {arg: "IP", name: "ip"}, {arg: "MASK", name: "mask"}]
      action: {type: "if_set_ip", ip_from: "ip", mask_from: "mask"}
      help: "Set interface IP address"

    - name: ip_ospf_cost
      tokens: ["ip", "ospf", "cost", {arg: "INT", name: "cost"}]
      action: {type: "ospf_if_cost_set", cost_from: "cost"}
      help: "Set OSPF interface cost"

    # Access Control List application
    - name: ip_access_group_in
      tokens: ["ip", "access-group", {arg: "INT", name: "num"}, "in"]
      action: {type: "acl_apply", direction: "in", number_from: "num"}
      help: "Apply access list to inbound traffic"

    - name: ip_access_group_out
      tokens: ["ip", "access-group", {arg: "INT", name: "num"}, "out"]
      action: {type: "acl_apply", direction: "out", number_from: "num"}
      help: "Apply access list to outbound traffic"

    - name: no_ip_access_group_in
      tokens: ["no", "ip", "access-group", {arg: "INT", name: "num"}, "in"]
      action: {type: "acl_remove_apply", direction: "in", number_from: "num"}
      help: "Remove inbound access list"

    - name: no_ip_access_group_out
      tokens: ["no", "ip", "access-group", {arg: "INT", name: "num"}, "out"]
      action: {type: "acl_remove_apply", direction: "out", number_from: "num"}
      help: "Remove outbound access list"

    # NAT interface designation
    - name: ip_nat_inside
      tokens: ["ip", "nat", "inside"]
      action: {type: "nat_if_inside"}
      help: "Mark interface as NAT inside (private network)"

    - name: ip_nat_outside
      tokens: ["ip", "nat", "outside"]
      action: {type: "nat_if_outside"}
      help: "Mark interface as NAT outside (public network)"

    - name: no_ip_nat_inside
      tokens: ["no", "ip", "nat", "inside"]
      action: {type: "nat_if_remove_inside"}
      help: "Remove NAT inside designation"

    - name: no_ip_nat_outside
      tokens: ["no", "ip", "nat", "outside"]
      action: {type: "nat_if_remove_outside"}
      help: "Remove NAT outside designation"

  CONFIG_VLAN:
    - name: exit
      tokens: ["exit"]
      action: {type: "mode_pop"}
      help: "Exit VLAN configuration"

    - name: end
      tokens: ["end"]
      action: {type: "mode_pop_to", mode: "PRIV_EXEC"}
      help: "Exit to privileged EXEC"

    - name: vlan_name
      tokens: ["name", {arg: "REST_OF_LINE", name: "vlan_name"}]
      guard:
        requires_cursor: "current_vlan"
      action:
        type: "vlan_set_name"
        vlan_cursor: "current_vlan"
        name_from: "vlan_name"
      help: "Name the currently selected VLAN"

  ROUTER_OSPF_CONFIG:
    - name: exit
      tokens: ["exit"]
      action: {type: "mode_pop"}
      help: "Exit router config"

    - name: end
      tokens: ["end"]
      action: {type: "mode_pop_to", mode: "PRIV_EXEC"}
      help: "Exit to privileged EXEC"

    - name: network_area
      tokens:
        - "network"
        - {arg: "IP", name: "ip"}
        - {arg: "WILDCARD", name: "wc"}
        - "area"
        - {arg: "AREA", name: "area"}
      action:
        type: "ospf_network_add"
        ip_from: "ip"
        wildcard_from: "wc"
        area_from: "area"
      help: "Advertise network in OSPF"

    - name: default_information_originate
      tokens: ["default-information", "originate"]
      action: {type: "set", path: "ospf.defaultInformationOriginate", value: true}
      help: "Advertise default route to OSPF neighbors"

    - name: no_default_information_originate
      tokens: ["no", "default-information", "originate"]
      action: {type: "set", path: "ospf.defaultInformationOriginate", value: false}
      help: "Stop advertising default route"

  LINE_VTY_CONFIG:
    - name: exit
      tokens: ["exit"]
      action: {type: "mode_pop"}
      help: "Exit line config"

    - name: end
      tokens: ["end"]
      action: {type: "mode_pop_to", mode: "PRIV_EXEC"}
      help: "Exit to privileged EXEC"

    - name: login_local
      tokens: ["login", "local"]
      action: {type: "set", path: "ssh.vty.login", value: "local"}
      help: "Use local user database"

    - name: transport_input_ssh
      tokens: ["transport", "input", "ssh"]
      action: {type: "set", path: "ssh.vty.transport", value: ["ssh"]}
      help: "Allow SSH only"

  LINE_CONSOLE_CONFIG:
    - name: exit
      tokens: ["exit"]
      action: {type: "mode_pop"}
      help: "Exit line config"

    - name: end
      tokens: ["end"]
      action: {type: "mode_pop_to", mode: "PRIV_EXEC"}
      help: "Exit to privileged EXEC"

    - name: logging_synchronous
      tokens: ["logging", "synchronous"]
      action: {type: "set", path: "line.console.loggingSynchronous", value: true}
      help: "Synchronize console messages with command input"

    - name: no_logging_synchronous
      tokens: ["no", "logging", "synchronous"]
      action: {type: "set", path: "line.console.loggingSynchronous", value: false}
      help: "Disable logging synchronous"

  DHCP_POOL_CONFIG:
    - name: exit
      tokens: ["exit"]
      action: {type: "mode_pop"}
      help: "Exit DHCP pool configuration"

    - name: end
      tokens: ["end"]
      action: {type: "mode_pop_to", mode: "PRIV_EXEC"}
      help: "Exit to privileged EXEC"

    - name: network
      tokens: ["network", {arg: "IP", name: "network"}, {arg: "MASK", name: "mask"}]
      action:
        type: "dhcp_pool_network"
        network_from: "network"
        mask_from: "mask"
      help: "Set network for DHCP pool"

    - name: default_router
      tokens: ["default-router", {arg: "IP", name: "gateway"}]
      action:
        type: "dhcp_pool_default_router"
        gateway_from: "gateway"
      help: "Set default gateway for DHCP clients"

    - name: dns_server
      tokens: ["dns-server", {arg: "IP", name: "dns"}]
      action:
        type: "dhcp_pool_dns_server"
        dns_from: "dns"
      help: "Set DNS server for DHCP clients"

