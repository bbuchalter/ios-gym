# Lefthook configuration for pre-commit checks
# Runs validation checks in parallel for faster commits

pre-commit:
  parallel: true
  commands:
    # Fast checks that can run in parallel
    grammar-sync-switch:
      glob: "*.yaml"
      run: |
        if [ -f "commands-2960-switch.yaml" ] && [ -f "web/public/commands-2960-switch.json" ]; then
          YAML_JSON=$(node -e "const yaml = require('js-yaml'); const fs = require('fs'); console.log(JSON.stringify(yaml.load(fs.readFileSync('commands-2960-switch.yaml', 'utf8')), null, 2));")
          CURRENT_JSON=$(cat web/public/commands-2960-switch.json)
          if [ "$YAML_JSON" != "$CURRENT_JSON" ]; then
            echo "❌ Switch grammar files out of sync! Run 'npm run build:grammar'"
            exit 1
          fi
          echo "✓ Switch grammar synchronized"
        fi

    grammar-sync-router:
      glob: "*.yaml"
      run: |
        if [ -f "commands-1941-router.yaml" ] && [ -f "web/public/commands-1941-router.json" ]; then
          YAML_JSON=$(node -e "const yaml = require('js-yaml'); const fs = require('fs'); console.log(JSON.stringify(yaml.load(fs.readFileSync('commands-1941-router.yaml', 'utf8')), null, 2));")
          CURRENT_JSON=$(cat web/public/commands-1941-router.json)
          if [ "$YAML_JSON" != "$CURRENT_JSON" ]; then
            echo "❌ Router grammar files out of sync! Run 'npm run build:grammar'"
            exit 1
          fi
          echo "✓ Router grammar synchronized"
        fi

    typecheck:
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit
      stage_fixed: true

    yaml-lint:
      glob: "*.yaml"
      run: npm run lint:yaml

    web-prettier:
      glob: "web/**/*.{ts,tsx,js,jsx,json,css}"
      run: cd web && npm run format:check

    web-lint:
      glob: "web/**/*.{ts,tsx,js,jsx}"
      run: cd web && npm run lint

    tests:
      glob: "src/**/*.{ts,tsx}"
      run: ./node_modules/.bin/jest --silent --passWithNoTests
